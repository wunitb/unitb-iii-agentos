name: release

on:
  push:
    tags:
      - "v*"

permissions: {}
jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: build ${{ matrix.arch }}-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - runner: macos-15
            os: darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.90"

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: build runtime
        run: cargo build --workspace --release --locked

      - name: stage bundle
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.arch }}-${{ matrix.os }}
        run: |
          set -euo pipefail
          ASSET="agentos-${VERSION#v}-$TARGET"
          STAGE="dist/$ASSET"
          mkdir -p "$STAGE/bin" "$STAGE/runtime/target/release"
          install -m 0755 target/release/agentos "$STAGE/bin/agentos"
          install -m 0755 target/release/agentos-tui "$STAGE/bin/agentos-tui"
          cp .iii-version "$STAGE/runtime/.iii-version"
          cp config.yaml "$STAGE/runtime/config.yaml"
          cp -R config agents hands identity integrations plugin workflows "$STAGE/runtime/"
          while IFS= read -r manifest; do
            destination="$STAGE/runtime/$(dirname "$manifest")"
            mkdir -p "$destination"
            cp "$manifest" "$destination/iii.worker.yaml"
            packaged_binary="agentos-$(basename "$(dirname "$manifest")")"
            cargo_toml="$(dirname "$manifest")/Cargo.toml"
            if [ -f "$cargo_toml" ]; then
              source_binary="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^name *=/{gsub(/^name *= *"|"$/,"");print;exit}' "$cargo_toml")"
              install -m 0755 "target/release/$source_binary" "$STAGE/runtime/target/release/$packaged_binary"
            elif [ "$packaged_binary" = "agentos-embedding" ]; then
              cp workers/embedding/{main.py,pyproject.toml,uv.lock} "$destination/"
            else
              echo "worker has no package definition: $packaged_binary" >&2
              exit 1
            fi
          done < <(find workers -name iii.worker.yaml -type f | sort)
          tar -czf "dist/$ASSET.tar.gz" -C "$STAGE" .
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256")
          fi

      - name: generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/${{ env.ASSET }}
          artifact-name: ${{ env.ASSET }}.spdx.json
          output-file: dist/${{ env.ASSET }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false

      - name: attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentos-${{ matrix.arch }}-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.spdx.json
          if-no-files-found: error

  validate:
    name: inspect ${{ matrix.arch }}-${{ matrix.os }} bundle
    needs: build
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
          - os: linux
            arch: aarch64
          - os: darwin
            arch: aarch64
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      HOME: ${{ github.workspace }}/.tmp/agentos-release-home
      AGENTOS_HOME: ${{ github.workspace }}/.tmp/agentos-release-home/.agentos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: agentos-${{ matrix.arch }}-${{ matrix.os }}
          path: dist
      - name: inspect isolated bundle
        run: |
          set -euo pipefail
          asset="agentos-${VERSION#v}-${TARGET_ARCH}-${TARGET_OS}"
          archive="dist/$asset.tar.gz"
          checksum="$archive.sha256"
          [[ -f "$archive" ]]
          [[ -f "$checksum" ]]
          [[ -f "dist/$asset.spdx.json" ]]
          (cd dist && sha256sum --check "$asset.tar.gz.sha256")
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          tar -tzf "$archive" > "$archive.contents"
          for required in \
            ./bin/agentos \
            ./bin/agentos-tui \
            ./runtime/.iii-version \
            ./runtime/config.yaml \
            ./runtime/workers/agent-core/iii.worker.yaml \
            ./runtime/target/release/agentos-agent-core \
            ./runtime/workers/embedding/main.py \
            ./runtime/workers/embedding/pyproject.toml \
            ./runtime/workers/embedding/uv.lock; do
            grep -Fx "$required" "$archive.contents" >/dev/null \
              || { echo "::error::bundle missing $required"; exit 1; }
          done
          extract="$RUNNER_TEMP/$asset"
          mkdir -p "$extract" "$HOME" "$AGENTOS_HOME"
          tar -xzf "$archive" -C "$extract"
          [[ -x "$extract/bin/agentos" ]] \
              || { echo "::error::packaged agentos is not executable"; stat "$extract/bin/agentos"; exit 1; }
          [[ -x "$extract/bin/agentos-tui" ]] \
              || { echo "::error::packaged agentos-tui is not executable"; stat "$extract/bin/agentos-tui"; exit 1; }
          [[ "$(cat "$extract/runtime/.iii-version")" == "$(cat .iii-version)" ]] \
            || { echo "::error::packaged iii version mismatch"; exit 1; }
          [[ -f "$extract/runtime/config.yaml" ]] \
            || { echo "::error::packaged config.yaml missing"; exit 1; }
          [[ ! -e "$extract/workers" ]] \
            || { echo "::error::checkout-relative workers directory leaked into bundle"; exit 1; }
          echo "validated $asset in an isolated home without source checkout"

  publish:
    permissions:
      contents: write
    name: publish release
    needs: [build, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.spdx.json
