name: ci

on:
  pull_request:
  push:
    branches: [main]

# Deny every GITHUB_TOKEN scope by default; each job re-grants only what it uses.
# `contents: read` is what actions/checkout needs on this public repository.
# Artifact upload/download (v7/v8) authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no scope here.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep this in lockstep with rust-toolchain.toml, Cargo.toml `rust-version`
  # and release.yml. tests/toolchain_pin.test.ts fails the build if they diverge.
  AGENTOS_RUST_TOOLCHAIN: "1.90"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  rust:
    name: rust quality + build + test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.90"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: assert the in-tree toolchain pin is the toolchain in use
        run: |
          set -euo pipefail
          installed="$(rustc --version | cut -d' ' -f2)"
          case "$installed" in
            "$AGENTOS_RUST_TOOLCHAIN"|"$AGENTOS_RUST_TOOLCHAIN".*) ;;
            *) echo "::error::rustc $installed does not match the pinned $AGENTOS_RUST_TOOLCHAIN"; exit 1 ;;
          esac
          echo "ok: rustc $installed matches rust-toolchain.toml"

      - name: cargo format
        run: cargo fmt --all -- --check

      # `clippy --all-targets` already type-checks everything `cargo check` would,
      # so there is no separate check step: it was 12 s of pure duplication.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Dev profile on purpose. The release binaries below are what
      # `portable-bundle` and `e2e-smoke` consume; a second LTO link of every test
      # binary verified nothing and cost ~4.5 minutes on every pull request.
      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build
        run: cargo build --workspace --release --locked

      - name: cargo dependency audit
        run: cargo install cargo-audit --locked && cargo audit

      # Advisories + bans (duplicate versions) + licences + source registries.
      # Policy and every dated exception live in deny.toml. No continue-on-error:
      # a new duplicate version, a new licence or an unvetted registry fails the PR.
      - name: cargo supply-chain policy
        run: |
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          cargo deny check

      - name: upload portable binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worker-binaries
          path: |
            target/release/agentos
            target/release/agentos-tui
            target/release/agentos-*
          retention-days: 7

  boot-smoke:
    name: boot smoke (no provider credentials)
    needs: rust
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: worker-binaries
          path: target/release/

      - name: chmod release binaries
        run: chmod +x target/release/agentos target/release/agentos-*

      - name: install pinned iii runtime
        run: |
          set -euo pipefail
          bash scripts/install-iii.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: boot through the product entry point and inspect the registry
        run: bash scripts/boot-smoke.sh

  node-unit:
    name: Node unit + governance + config boot
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: install deps
        run: bun install --frozen-lockfile

      - name: install pinned iii runtime
        run: |
          set -euo pipefail
          bash scripts/install-iii.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: verify iii runtime
        run: |
          iii --version
          test -x "$(command -v iii-worker)"

      - name: typecheck Node sources
        run: bun run typecheck

      - name: run Node unit suite
        run: bun run test:unit

      # Governance evidence (README bootstrap contract, reconciled-history
      # contract, removed-dependency guard) is real, but it is not a test of
      # the software. It runs as its own gate so `test:unit` keeps meaning
      # "tests of the product".
      - name: run governance evidence suite
        run: bun run test:governance

      # Every published count (workers, function ids, tests, providers, CI jobs,
      # release targets, worker tables) is recomputed from the tree and compared
      # with README/ARCHITECTURE/website/plugin.
      - name: assert published counts match the tree
        run: bun run counts:check

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  portable-bundle:
    name: validate portable bundle linux-x86_64
    needs: rust
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      TARGET_OS: linux
      TARGET_ARCH: x86_64
      HOME: ${{ github.workspace }}/.tmp/agentos-portable-home
      AGENTOS_HOME: ${{ github.workspace }}/.tmp/agentos-portable-home/.agentos
      BIN_DIR: ${{ github.workspace }}/.tmp/agentos-portable-bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: worker-binaries
          path: target/release/
      - name: stage and inspect isolated bundle
        run: |
          set -euo pipefail
          version="0.1.0"
          asset="agentos-${version}-${TARGET_ARCH}-${TARGET_OS}"
          stage="$RUNNER_TEMP/$asset"
          archive="$RUNNER_TEMP/$asset.tar.gz"
          checksum="$archive.sha256"
          mkdir -p "$stage/bin" "$stage/runtime/target/release" "$HOME" "$AGENTOS_HOME" "$BIN_DIR"
          install -m 0755 target/release/agentos "$stage/bin/agentos"
          install -m 0755 target/release/agentos-tui "$stage/bin/agentos-tui"
          cp .iii-version "$stage/runtime/.iii-version"
          cp config.yaml "$stage/runtime/config.yaml"
          cp iii.lock "$stage/runtime/iii.lock"
          cp -R config agents hands identity integrations plugin workflows "$stage/runtime/"
          while IFS= read -r manifest; do
            destination="$stage/runtime/$(dirname "$manifest")"
            mkdir -p "$destination"
            cp "$manifest" "$destination/iii.worker.yaml"
            packaged_binary="agentos-$(basename "$(dirname "$manifest")")"
            cargo_toml="$(dirname "$manifest")/Cargo.toml"
            if [[ -f "$cargo_toml" ]]; then
              source_binary="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^name *=/{gsub(/^name *= *"|"$/,"");print;exit}' "$cargo_toml")"
              install -m 0755 "target/release/$source_binary" "$stage/runtime/target/release/$packaged_binary"
            elif [[ "$packaged_binary" == "agentos-embedding" ]]; then
              cp workers/embedding/{main.py,pyproject.toml,uv.lock} "$destination/"
            else
              echo "worker has no package definition: $packaged_binary" >&2
              exit 1
            fi
          done < <(find workers -name iii.worker.yaml -type f | sort)
          tar -czf "$archive" -C "$stage" .
          sha256sum "$archive" > "$checksum"
          tar -tzf "$archive" > "$archive.contents"
          for required in \
            ./bin/agentos \
            ./bin/agentos-tui \
            ./runtime/.iii-version \
            ./runtime/config.yaml \
            ./runtime/iii.lock \
            ./runtime/workers/agent-core/iii.worker.yaml \
            ./runtime/target/release/agentos-agent-core \
            ./runtime/workers/embedding/main.py \
            ./runtime/workers/embedding/pyproject.toml \
            ./runtime/workers/embedding/uv.lock; do
            grep -Fx "$required" "$archive.contents" >/dev/null \
              || { echo "::error::bundle missing $required"; exit 1; }
          done
          extract="$RUNNER_TEMP/extract-$asset"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          [[ -x "$extract/bin/agentos" ]] \
            || { echo "::error::packaged agentos is not executable"; stat "$extract/bin/agentos"; exit 1; }
          [[ -x "$extract/bin/agentos-tui" ]] \
            || { echo "::error::packaged agentos-tui is not executable"; stat "$extract/bin/agentos-tui"; exit 1; }
          [[ "$(cat "$extract/runtime/.iii-version")" == "$(cat .iii-version)" ]] \
            || { echo "::error::packaged iii version mismatch"; exit 1; }
          [[ -f "$extract/runtime/config.yaml" ]] \
            || { echo "::error::packaged config.yaml missing"; exit 1; }
          [[ ! -e "$extract/workers" ]] \
            || { echo "::error::checkout-relative workers directory leaked into bundle"; exit 1; }
          echo "validated native linux-x86_64 bundle without checkout-relative runtime paths"

  python:
    name: python worker tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest workers/embedding/test_main.py -q

  website:
    name: website build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  scripts:
    name: installer shellcheck
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck --severity=warning scripts/install.sh scripts/dev-up.sh scripts/desktop-up.sh scripts/memworkr-sync.sh website/public/install.sh scripts/install-iii.sh scripts/boot-smoke.sh

  worker-yaml:
    name: validate iii.worker.yaml
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install manifest validator
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: validate every workers/*/iii.worker.yaml
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path
          import yaml

          fail = False
          for d in sorted(Path("workers").iterdir()):
              if not d.is_dir():
                  continue
              p = d / "iii.worker.yaml"
              if not p.exists():
                  print(f"::error::missing {p}")
                  fail = True
                  continue
              m = yaml.safe_load(p.read_text())
              for k in ("iii", "name", "runtime", "scripts"):
                  if k not in m:
                      print(f"::error::{p} missing key {k}")
                      fail = True
              if m.get("name") != d.name:
                  print(f"::error::{p} name='{m.get('name')}' != folder '{d.name}'")
                  fail = True
              if m.get("iii") != "v1":
                  print(f"::error::{p} iii must be v1")
                  fail = True
              runtime = m.get("runtime", {})
              if not isinstance(runtime, dict) or runtime.get("kind") not in ("rust", "python"):
                  print(f"::error::{p} runtime.kind must be rust or python")
                  fail = True
              scripts = m.get("scripts", {})
              if not isinstance(scripts, dict) or not isinstance(scripts.get("start"), str):
                  print(f"::error::{p} scripts.start must be a command string")
                  fail = True
              print(f"ok: {m.get('name')}")
          sys.exit(1 if fail else 0)
          PYEOF

  namespace-clash:
    name: "no sandbox::* clash with builtin"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "assert no sandbox:: registration"
        run: |
          set -e
          if grep -rn '"sandbox::' workers/ crates/ 2>/dev/null; then
            echo "::error::workers must not register sandbox::* — that namespace is reserved for the builtin iii-sandbox worker (iii v0.22.1). Use wasm:: instead."
            exit 1
          fi
          echo "ok: no sandbox::* registrations in agentos workers"

  e2e-smoke:
    name: e2e smoke (no LLM key required)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: rust
    env:
      AGENTOS_API_KEY: ci-smoke-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: install deps
        run: bun install --frozen-lockfile

      - name: typecheck Node examples
        run: bun run typecheck:examples

      - name: test Node example adapters
        run: bun run test:examples

      - name: typecheck startup configuration tests
        run: bun run typecheck:scripts

      - name: test startup configuration
        run: bun run test:scripts

      - name: download worker binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: worker-binaries
          path: target/release/

      - name: chmod binaries
        run: chmod +x target/release/agentos-*

      - name: install pinned iii runtime
        run: |
          set -euo pipefail
          bash scripts/install-iii.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: verify iii runtime
        run: |
          iii --version
          test -x "$(command -v iii-worker)"

      - name: start engine + workers
        run: |
          set -euo pipefail
          mkdir -p data
          iii --config config.yaml > engine.log 2>&1 &
          ENGINE_PID=$!
          echo "ENGINE_PID=$ENGINE_PID" >> "$GITHUB_ENV"
          for _ in {1..60}; do
            timeout 1 bash -c "echo > /dev/tcp/127.0.0.1/3111" 2>/dev/null && break
            kill -0 "$ENGINE_PID" 2>/dev/null || { cat engine.log; exit 1; }
            sleep 0.5
          done
          timeout 1 bash -c "echo > /dev/tcp/127.0.0.1/3111" 2>/dev/null \
            || { echo "::error::engine HTTP port never opened"; cat engine.log; exit 1; }
          # The registry chat console is opt-in: it has no bind-host key and
          # listens on 0.0.0.0, so config.yaml does not boot it by default.
          # Assert whichever state config.yaml declares, so this step is correct
          # regardless of which branch lands first.
          if grep -qE '^[[:space:]]*-[[:space:]]*name:[[:space:]]*console[[:space:]]*$' config.yaml; then
            for _ in {1..120}; do
              console_probe="$(curl -sS --max-redirs 0 -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:3113/ 2>/dev/null || true)"
              [[ "$console_probe" == 200\ * ]] && break
              kill -0 "$ENGINE_PID" 2>/dev/null || { cat engine.log; exit 1; }
              sleep 1
            done
            [[ "$console_probe" == 200\ * ]] \
              || { echo "::error::config.yaml boots the console but it never opened"; cat engine.log; exit 1; }
          else
            sleep 5
            if timeout 1 bash -c "echo > /dev/tcp/127.0.0.1/3113" 2>/dev/null; then
              echo "::error::config.yaml does not boot the console, but something is listening on 3113"
              cat engine.log
              exit 1
            fi
            echo "ok: console is not booted and port 3113 is closed"
          fi
          for w in agentos-core agentos-llm-router agentos-memory agentos-security agentos-realm agentos-mission agentos-directive agentos-hierarchy agentos-council agentos-ledger agentos-pulse agentos-bridge agentos-wasm-sandbox; do
            ./target/release/$w > "$w.log" 2>&1 &
          done
          required_functions=(state::set state::get state::list health::check agentos::llm::providers memory::store security::scan_injection realm::create mission::create council::submit ledger::set_budget wasm::execute)
          for _ in {1..60}; do
            missing=0
            for function_id in "${required_functions[@]}"; do
              grep -q "Function $function_id" engine.log || missing=1
            done
            [[ "$missing" -eq 0 ]] && break
            sleep 0.5
          done
          for function_id in "${required_functions[@]}"; do
            grep -q "Function $function_id" engine.log \
              || { echo "::error::missing registered function $function_id"; cat engine.log; exit 1; }
          done
          curl -fsS http://127.0.0.1:3111/api/health >/dev/null

      - name: engine WS port + HTTP port listening
        run: |
          set -e
          for port in 49134 3111; do
            timeout 5 bash -c "until echo > /dev/tcp/127.0.0.1/$port 2>/dev/null; do sleep 0.5; done" \
              || (echo "::error::port $port never opened"; cat engine.log; exit 1)
            echo "ok: port $port listening"
          done

      - name: credential-free worker integration tests
        env:
          AGENTOS_E2E: "1"
          III_URL: ws://localhost:49134
        run: >-
          bunx vitest --run --config vitest.e2e.config.ts e2e/full-stack.test.ts
          --testNamePattern="realm::create|mission::create|security::scan_injection|wasm::list_modules"

      - name: "assert wasm:: + sandbox:: coexist (no namespace clash)"
        run: |
          set -e
          # wasm-sandbox worker must register wasm::* not sandbox::*
          grep -q 'Function wasm::execute' engine.log \
            || (echo "::error::wasm::execute not registered"; exit 1)
          # The builtin sandbox::* worker is opt-in (commented in config.yaml);
          # if iii-sandbox were enabled, sandbox::create would also appear without
          # colliding with our wasm::* names.
          if grep -q 'Function sandbox::execute' engine.log; then
            echo "::error::sandbox::execute is reserved for builtin iii-sandbox (iii v0.22.1)"
            exit 1
          fi
          echo "ok: wasm:: registered, no agentos worker shadows sandbox::*"

      - name: dump worker logs on failure
        if: failure()
        run: |
          for f in *.log; do
            echo "=== $f ==="
            tail -100 "$f" || true
          done

      - name: stop
        if: always()
        run: |
          pkill -f 'agentos-' || true
          if [ -n "${ENGINE_PID:-}" ]; then kill "$ENGINE_PID" || true; fi

  e2e-full:
    name: e2e full (main branch, credentials required)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: e2e-smoke
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'wunitb/unitb-iii-agentos' && vars.AGENTOS_FULL_E2E_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: install deps
        run: bun install --frozen-lockfile

      - name: download worker binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: worker-binaries
          path: target/release/

      - name: chmod binaries
        run: chmod +x target/release/agentos-*

      - name: install pinned iii runtime
        run: |
          set -euo pipefail
          bash scripts/install-iii.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: require live test credentials
        env:
          AGENTOS_API_KEY: ${{ secrets.AGENTOS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$AGENTOS_API_KEY" || { echo "::error::AGENTOS_API_KEY is required"; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY is required"; exit 1; }

      - name: start engine + workers
        env:
          AGENTOS_API_KEY: ${{ secrets.AGENTOS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          mkdir -p data
          iii --config config.yaml > engine.log 2>&1 &
          ENGINE_PID=$!
          echo "ENGINE_PID=$ENGINE_PID" >> "$GITHUB_ENV"
          for _ in {1..30}; do
            timeout 1 bash -c "echo > /dev/tcp/127.0.0.1/3111" 2>/dev/null && break
            sleep 1
          done
          for w in agentos-core agentos-llm-router agentos-memory agentos-security \
                   agentos-realm agentos-mission agentos-directive agentos-hierarchy \
                   agentos-council agentos-ledger agentos-pulse agentos-bridge \
                   agentos-wasm-sandbox; do
            ./target/release/$w > "$w.log" 2>&1 &
          done
          required_functions=(state::set state::get state::list realm::create realm::list mission::create council::submit ledger::set_budget hierarchy::set security::scan_injection memory::store agentos::llm::providers agentos::llm::route agentos::llm::complete agent::chat wasm::list_modules)
            for _ in {1..60}; do
            missing=0
              for function_id in "${required_functions[@]}"; do
                grep -q "Function $function_id" engine.log || missing=1
            done
            [ "$missing" -eq 0 ] && break
            sleep 0.5
          done
          for function_id in "${required_functions[@]}"; do
            grep -q "Function $function_id" engine.log
          done
          curl -fsS http://127.0.0.1:3111/api/health >/dev/null

      - name: vitest e2e
        env:
          AGENTOS_E2E: "1"
          AGENTOS_BASE_URL: http://127.0.0.1:3111
          AGENTOS_E2E_MODEL: claude-sonnet-4-20250514
          III_URL: ws://localhost:49134
          AGENTOS_API_KEY: ${{ secrets.AGENTOS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run test:e2e

      - name: dump logs on failure
        if: failure()
        run: |
          for f in *.log; do
            echo "=== $f ==="
            tail -200 "$f" || true
          done

      - name: stop
        if: always()
        run: |
          pkill -f 'agentos-' || true
          if [ -n "${ENGINE_PID:-}" ]; then kill "$ENGINE_PID" || true; fi
