iii: v1
scripts:
  install: '[ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"; cargo build --release'
  start: '[ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"; cargo run --release'
name: a2a-cards
runtime:
  kind: rust
description: A2A agent card discovery — generate and list agent cards, and serve a catalogue copy of the discovery document at GET /api/a2a/agent-card (the spec path /.well-known/agent.json belongs to the a2a worker)
