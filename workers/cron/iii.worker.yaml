iii: v1
scripts:
  install: '[ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"; cargo build --release'
  start: '[ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"; cargo run --release'
name: cron
runtime:
  kind: rust
description: Scheduled function invocations on top of iii-cron — session cleanup, cost aggregation, rate limit reset
