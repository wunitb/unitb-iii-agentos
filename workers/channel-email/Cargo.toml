[package]
name = "agentos-channel-email"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[[bin]]
name = "agentos-channel-email"
path = "src/main.rs"

[dependencies]
agentos-http-adapter = { path = "../../crates/http-adapter" }
iii-sdk = "=0.22.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
