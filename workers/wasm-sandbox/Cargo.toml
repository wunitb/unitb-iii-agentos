[package]
name = "agentos-wasm-sandbox"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
agentos-http-adapter = { path = "../../crates/http-adapter" }
iii-sdk = "=0.22.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
wasmtime = "44.0.3"
dashmap = "6"
