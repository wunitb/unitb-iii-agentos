iii: v1
name: embedding
runtime:
  kind: python
scripts:
  setup: 'command -v python3 >/dev/null || (apt-get update && apt-get install -y python3-venv python3-pip)'
  install: 'python3 -m venv .venv && .venv/bin/pip install -e .'
  start: '.venv/bin/python -m main'
description: "Text embedding generation via SentenceTransformers (fallback: hash-based)"
