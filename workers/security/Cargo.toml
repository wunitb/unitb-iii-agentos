[package]
name = "agentos-security"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
agentos-http-adapter = { path = "../../crates/http-adapter" }
iii-sdk = "=0.22.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
ed25519-dalek = "2"
hex = "0.4"
dashmap = "6"
