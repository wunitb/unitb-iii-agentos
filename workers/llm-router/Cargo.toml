[package]
name = "agentos-llm-router"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "agentos-llm-router"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.22.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dashmap = "6"
