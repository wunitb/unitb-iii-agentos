[package]
name = "agentos-channel-teams"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "agentos-channel-teams"
path = "src/main.rs"

[dependencies]
agentos-bus-auth.workspace = true
agentos-http-adapter.workspace = true
iii-sdk.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, features = ["json"] }
hmac.workspace = true
sha2.workspace = true
# Bot Connector JWTs are RS256; ring 0.17 is already in the lockfile through
# rustls, so this adds an edge, not a crate. Same for data-encoding (tungstenite).
ring = "0.17"
data-encoding = "2"

[dev-dependencies]
agentos-http-adapter = { workspace = true, features = ["fake-bus"] }
