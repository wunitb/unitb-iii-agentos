[package]
name = "agentos-memory"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
iii-sdk = "=0.22.1"
agentos-http-adapter = { path = "../../crates/http-adapter" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
