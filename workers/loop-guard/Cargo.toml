[package]
name = "agentos-loop-guard"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "agentos-loop-guard"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.22.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
