[package]
name = "agentos-session-replay"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "agentos-session-replay"
path = "src/main.rs"

[dependencies]
agentos-http-adapter = { path = "../../crates/http-adapter" }
iii-sdk = "=0.22.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
