[package]
name = "agentos-channel-discord"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentos-channel-discord"
path = "src/main.rs"

[dependencies]
agentos-bus-auth.workspace = true
agentos-http-adapter.workspace = true
iii-sdk.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, features = ["json"] }
# Discord signs interactions and webhook events with Ed25519 (X-Signature-Ed25519).
ed25519-dalek.workspace = true
hex.workspace = true

[dev-dependencies]
agentos-http-adapter = { workspace = true, features = ["fake-bus"] }
