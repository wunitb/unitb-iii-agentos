[package]
name = "agentos-security-map"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "agentos-security-map"
path = "src/main.rs"

[dependencies]
agentos-http-adapter = { path = "../../crates/http-adapter" }
iii-sdk = "=0.22.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ed25519-dalek = "3"
rand = "0.10"
subtle = "2"
