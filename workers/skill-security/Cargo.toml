[package]
name = "agentos-skill-security"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "agentos-skill-security"
path = "src/main.rs"

[dependencies]
agentos-http-adapter = { path = "../../crates/http-adapter" }
iii-sdk = "=0.22.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
ed25519-dalek = { version = "3", features = ["pkcs8"] }
base64 = "0.22"
spki = "0.7"
