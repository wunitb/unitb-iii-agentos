[package]
name = "agentos-channel-twitch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "agentos-channel-twitch"
path = "src/main.rs"

[dependencies]
agentos-bus-auth.workspace = true
agentos-http-adapter.workspace = true
iii-sdk.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
# EventSub's replay guard parses the RFC 3339 `Twitch-Eventsub-Message-Timestamp`;
# chrono is already resolved for 20+ members, so this is an edge, not a crate.
chrono.workspace = true
reqwest = { workspace = true, features = ["json"] }

[dev-dependencies]
agentos-http-adapter = { workspace = true, features = ["fake-bus"] }
