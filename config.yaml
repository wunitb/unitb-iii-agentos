# iii 0.23 engine-only configuration. Run via scripts/oci-stack.sh.
# Raw bootstrap and Compose stay inside one OCI network boundary; only the
# RBAC-gated edge may be published, to host loopback. The marker is an operator
# misconfiguration guard, not a sandbox against hostile same-UID processes.
workers:
  - name: configuration
    config:
      adapter:
        name: fs
        config:
          directory: ./config
      ttl_seconds: 0
  - name: iii-worker-manager#raw
    config:
      host: 127.0.0.1
      port: 49129
  # Mandatory manager must retain the bare name; upstream otherwise injects
  # a third, ungated default listener. This bare instance is our gated edge.
  - name: iii-worker-manager
    config:
      host: 0.0.0.0
      port: 49134
      rbac:
        auth_function_id: agentos::bus_auth
        on_function_registration_function_id: agentos::bus_on_register
        on_trigger_registration_function_id: agentos::bus_on_trigger
        on_trigger_type_registration_function_id: agentos::bus_on_trigger_type
        expose_functions:
          - match("*")
  - name: iii-stream
# Registry primitives are pinned in worker-compose.yaml, not engine workers.
# shell, harness, console, and the legacy iii-bridge are not started.
