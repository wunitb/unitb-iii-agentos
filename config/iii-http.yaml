id: iii-http
name: HTTP
description: HTTP server settings — host/port binding, CORS, request timeout, concurrency limit, and global middleware.
value:
  concurrency_request_limit: 2048
  cors:
    allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    allowed_origins:
    - http://127.0.0.1:5173
    - http://localhost:5173
  default_timeout: 300000
  # OCI internal interface; the launcher publishes API3111 to host loopback only.
  host: 0.0.0.0
  middleware: []
  port: 3111
